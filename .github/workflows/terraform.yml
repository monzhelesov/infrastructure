name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'terraform/main/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create SA key file
        run: |
          echo '${{ secrets.YC_SA_KEY }}' | base64 -d > ${{ github.workspace }}/key.json 2>/dev/null || \
          echo '${{ secrets.YC_SA_KEY }}' > ${{ github.workspace }}/key.json
          echo "Key file size: $(wc -c < ${{ github.workspace }}/key.json)"
          echo "Key file start: $(head -c 20 ${{ github.workspace }}/key.json)"

      - name: Terraform Init
        working-directory: terraform/main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_service_account_key_file: ${{ github.workspace }}/key.json
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform init -reconfigure

      - name: Terraform Plan
        working-directory: terraform/main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_service_account_key_file: ${{ github.workspace }}/key.json
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform/main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_service_account_key_file: ${{ github.workspace }}/key.json
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve
